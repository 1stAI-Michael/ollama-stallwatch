# Log rotation, fleet standard — 25 MB x 4 files = 100 MB cap per container.
# See monitoring/STANDARD.md. Also set daemon-wide in /etc/docker/daemon.json;
# repeated here so the intent is visible in git and travels with the stack.
#
# Why it matters: json-file has NO rotation by default. On ti-30 the ollama log
# had grown to 919 MB (~61 MB/day, driven by OLLAMA_DEBUG=1 plus a 1 Hz
# /api/ps poller), on ti11 to 868 MB. Worse, an unclean shutdown on 2026-07-05
# left a block of NUL bytes in both files, and `docker logs` stops dead at it —
# 99% of ti-30's log was unreachable while the file kept growing. A rotated log
# ages that damage out instead of carrying it forever.
#
# Log-Rotation, Flotten-Standard — 25 MB x 4 Dateien = 100 MB Deckel je Container.
# Greift erst beim NEUERZEUGEN eines Containers, nicht beim Neustart.
x-logging: &logdefaults
  driver: json-file
  options:
    max-size: "25m"
    max-file: "4"

services:
  ollama:
    logging: *logdefaults
    # Pinned image version (not :latest) for controlled updates.
    # Image-Version gepinnt (nicht :latest), fuer kontrollierte Updates.
    # bis 11-Mai-206 Abstimmung s. Slack 9-Mai 10:09
    #
    # MESSLAUF 20.10.2026 abgeschlossen und zurueckgedreht (fA-1579). Gemessen mit
    # 0.40.6 auf dieser Maschine: 4 von 12 klinischen Antworten weichen von der
    # Referenz ab, dreifach reproduzierbar, bei unveraendertem Modell-Digest. Kein
    # Umstieg, solange die Aerzte die neuen Antworten nicht gesehen haben.
    # Wieder umstellen heisst: diese Zeile auf 0.40.6 und `docker compose up -d ollama`.
    image: ollama/ollama:0.19.0

    container_name: ollama
    restart: unless-stopped
    networks: [openllm-net]

    # Bind to host IP(s) from .env. Use BIND_IP=0.0.0.0 for all interfaces.
    # Bindet an Host-IP(s) aus .env. BIND_IP=0.0.0.0 = alle Interfaces.
    ports:
      - "${BIND_IP}:11434:11434"
      - "${BIND_IP_WLAN}:11434:11434"

    # External DNS for reliable resolution of registry.ollama.ai.
    # Externe DNS fuer zuverlaessige Aufloesung von registry.ollama.ai.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # Persistence path is composable via DATA_ROOT in .env.
    # Persistenzpfad ueber DATA_ROOT in .env konfigurierbar.
    volumes:
      - ${DATA_ROOT}/ollama:/root/.ollama

    environment:
      # ── Scheduling & Queuing ──
      # 2 parallel slots for concurrent request batching; MoE benefits from parallelism.
      # 2 parallele Slots fuer Request-Batching; MoE profitiert von Parallelitaet.
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
      # ── Kein Weg nach draussen ──
      # 0.40.x ruft beim Start von sich aus
      # https://ollama.com/api/experimental/model-recommendations und wiederholt das
      # alle 4 Stunden; dafuer legt es sich ein id_ed25519-Paar im Modellverzeichnis an.
      # Gemessen 20.10.2026 im Schatten-Behaelter (fA-1579). Auf einer Maschine mit
      # klinischen Daten ist das eine Verbindung, die niemand bestellt hat.
      # Gegenprobe beider Richtungen: ohne die Variable steht "Ollama cloud disabled:
      # false" im Log und cache/model-recommendations.json wird angelegt; mit ihr
      # "skipping model recommendations refresh because cloud is disabled" und das
      # Verzeichnis bleibt leer — bei voll funktionsfaehigem Dienst.
      # In 0.19.0 wirkungslos (die Funktion gibt es dort nicht) und darum harmlos.
      OLLAMA_NO_CLOUD: "true"
      # Queue depth: requests wait instead of forcing model unload (default 512).
      # Warteschlange: Requests warten statt Modelle zu entladen (Default 512).
      OLLAMA_MAX_QUEUE: "16"
      # Unload idle models after 10 min (default 5m); buffer for RAG workflows.
      # Idle-Modelle nach 10 Min entladen (Default 5m); Puffer fuer RAG-Workflows.
      OLLAMA_KEEP_ALIVE: "10m"

      # ── Logging ──
      # Debug mode: logs model name, token counts, timings per request.
      # Debug-Modus: loggt Modellname, Token-Counts und Timings pro Request.
      OLLAMA_DEBUG: "1"

      # ── Context & memory ──
      # 128k context matches DIWA split-pool spec (giants >128k routed to GX-10).
      # 128k Kontext = DIWA-Split-Pool-Spec (Giganten >128k gehen auf GX-10).
      OLLAMA_CONTEXT_LENGTH: "131072"
      # Flash Attention reduces KV-cache VRAM by ~30-50%.
      # Flash Attention reduziert KV-Cache VRAM um ~30-50%.
      OLLAMA_FLASH_ATTENTION: "1"
      # 2 GiB reserve = conservative, practical.
      # 2 GiB Reserve = konservativ, praxistauglich.
      OLLAMA_GPU_OVERHEAD: "2147483648"

      # ── GPU ──
      # All visible GPUs; Ollama auto-distributes layers if a model exceeds one card.
      # Alle sichtbaren GPUs; Ollama verteilt Layers automatisch wenn Modell zu gross fuer eine.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

    runtime: nvidia

    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 5s
      retries: 5

  tei-embed:
    # ABGESCHALTET am 20.10.2026 auf Michaels Ansage (fA-1311 / fA-1575).
    # Switched off 2026-10-20 — kept, not deleted: a compose profile takes it out of
    # `docker compose up -d` while the documented state below stays readable in full.
    # Wieder einschalten: `docker compose --profile aus up -d tei-embed`. Der Modell-Cache
    # unter ${DATA_ROOT}/tei-embed (2,2 G) ist absichtlich nicht angetastet.
    #
    # Grund, gemessen (fA-1575, Antwort des Flows-Lastmanagements 20.10.2026 09:46): der
    # Endpunkt ti30-embed-cpu steht seit dem 13.10.2026 auf enabled=FALSE — das ist Michaels
    # eigener Entscheid aus fA-1434 — und zaehlt 0 Anfragen in 30 Tagen; die letzten 37
    # ueberhaupt am 23./24.09. Kontrollfall derselben Maschine im selben Zeitraum:
    # ti30-rerank-cpu 18, ti30-combined 30.077. Die Null ist also echt und nicht eine leere
    # Tabelle. Zweiter Beleg von hier: Open WebUI auf diesem Host embedded lokal mit
    # all-MiniLM-L6-v2 (RAG_EMBEDDING_MODEL), ruft :8001 also nicht; am 20.10. um 12:20 stand
    # keine einzige Verbindung auf dem Port.
    #
    # Der Deckel unten (12G, Commit 821e995) wurde damit gegenstandslos, BEVOR er je wirkte:
    # er haette erst beim Neuanlegen gegriffen. Er bleibt als Messung stehen, weil die
    # Begruendung unabhaengig vom Abschalten gilt — falls der Dienst zurueckkommt, kommt er
    # mit 12G zurueck.
    #
    # Rest-Risiko, ausdruecklich getragen (Michael, 20.10.2026): wer am Lastmanagement vorbei
    # direkt auf :8001 geht, bekommt ab jetzt "connection refused". Ehrlich dazu: WIR sehen
    # das nicht von selbst — eine abgewiesene Verbindung wird nirgends protokolliert, sie
    # faellt nur der Gegenseite auf. Michael: "wenn jemand am lastmanagement vorbei geht
    # werden wir es dann sehen, das ist besser als es nicht zu wissen."
    profiles: ["aus"]
    logging: *logdefaults
    # CPU-only Text-Embeddings-Inference (bge-m3) as failover for the GX-10 :8001 endpoint.
    # Same host port 8001 as GX-10 for drop-in compatibility — Coordinator registers TI-30 as backup rank.
    # CPU-only bge-m3-Embedding als Backup fuer GX-10 :8001. Gleicher Host-Port fuer Drop-in-Kompatibilitaet.
    # fA-652 (Michael, 11.09.2026): festgenagelt auf den Stand, der HIER LAEUFT —
    # TEI 1.9.3, sha-f9a0643, gebaut 2026-06-22. Auf den DIGEST, nicht auf einen
    # Versions-Tag: am 11.09. gemessen trugen `cpu-latest` (e65aa131) UND
    # `cpu-1.9.3` (c26a2262) bereits andere Bits als das laufende Abbild. Ein
    # blosses Neuanlegen haette die Embedding-Engine also still ausgetauscht —
    # und Embeddings sind Ergebnis (Tabu ERGEBNIS): das scheitert nicht, es
    # liefert andere Zahlen. Ein Wechsel gehoert gemessen, nicht mitgenommen:
    # vorher/nachher `python3 tests/tei_acceptance.py` gegen GX-10.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:7f8cbd5fbf27d1ad82450b68ec37e542bbfb0d03e6dc79d6d00242022f2fc4c7
    container_name: tei-embed
    restart: unless-stopped
    networks: [openllm-net]

    ports:
      - "${BIND_IP}:8001:80"

    volumes:
      - ${DATA_ROOT}/tei-embed:/data

    environment:
      HUGGINGFACE_HUB_CACHE: "/data"
      HF_HOME: "/data"

    command:
      - --model-id=BAAI/bge-m3
      - --max-batch-tokens=8192
      - --max-client-batch-size=64
      # Must read "=false", NOT be left out. In TEI 1.9.3 --auto-truncate takes an optional
      # value and defaults to TRUE (`--help`: "[default: true]"), unlike TEI 1.5.0 on ti-10
      # where the bare flag is a boolean defaulting to false. Measured 2026-10-12 (fA-1437):
      # with the line simply deleted, /info still reported auto_truncate true and an input of
      # 26003 tokens still answered HTTP 200 with a 1x1024 vector in 32 s — a silent vector
      # for a text nobody sent. Dropping the flag here would look like compliance and change
      # nothing.
      # Diese Zeile muss "=false" heissen, nicht fehlen: in TEI 1.9.3 ist die Flagge
      # standardmaessig AN. Gegenprobe nach jeder Aenderung: /info zeigt auto_truncate false,
      # und eine Eingabe ueber 8192 Token MUSS abgelehnt werden (Kontrollfall, muss rot sein).
      # Folge ist gewollt: bisher still gekuerzte Aufrufe scheitern jetzt laut, der Aufrufer
      # muss stueckeln.
      - --auto-truncate=false

    # CPU/RAM caps: leave headroom for ollama (2 cores active) + system.
    #
    # The 10G is NOT generous — it is 0.05 GiB of slack. Measured 2026-09-24 (fA-1311):
    # a fresh container reaches 9.97 GiB anon right after warmup, before serving a single
    # request; 20 short requests and one oversize input move it by less than 0.03 GiB.
    # The demand is real, not an allocator filling what it may have: the same start line
    # under a 6G and a 4G cap is OOM-killed during warmup, while 10G comes up (control).
    # An earlier note here claimed "~5 GB steady after warmup" — that is what `docker stats`
    # shows once part of the process has been swapped out, not what it needs.
    #
    # The driver is --max-batch-tokens above, and it grows faster than the number:
    #   2048 -> 2.32 GiB   4096 -> 3.90 GiB   8192 (today) -> 9.95 GiB
    # Lowering it would halve the footprint, but it changes batching — run
    # `python3 tests/tei_acceptance.py` against GX-10 first. Embeddings are Tabu ERGEBNIS:
    # they do not fail, they answer differently.
    #
    # 12G — decided by Michael 2026-10-20 (fA-1311): raise the cap, leave --max-batch-tokens
    # alone. Why the cap is the problem and not merely "99.5% full": measured 2026-10-20, two
    # days after the container started, anon was 4.86 GiB AND swap 5.29 GiB — the working set
    # is ~10.1 GiB and the kernel keeps half of it on disk to stay under the cap
    # (memory.events max = 1426 in those two days, oom_kill 0). The "~4.9 GiB" that
    # `docker stats` reports is exactly the swapped-out illusion the paragraph above warns of.
    # A cap is a limit, not a reservation: the host has 30 GiB, so 12G here and 10G on
    # tei-rerank can only collide if both peak at once — tei-rerank sits at 0.5 GiB.
    # Takes effect ONLY when the container is recreated (`docker compose up -d tei-embed`),
    # which is an intervention — not inside the clinical window Mo-Fr 08:00-15:00 Berlin.
    # Gegenprobe after recreating: memory.swap.current must fall well below 5 GiB and
    # memory.events max must stop climbing. Control case = one 8103-token input, which took
    # 33.71 s on 2026-10-12 with half the working set swapped out; if it is not faster, the
    # swap was not the cost and this change bought nothing.
    #
    # 12G — entschieden von Michael am 20.10.2026 (fA-1311): Deckel hoch, max-batch-tokens
    # bleibt. Wirkt erst beim NEUANLEGEN des Containers, nicht im Klinikfenster.
    # Offen (fA-1311 Teil 2): ob dieser Endpunkt ueberhaupt benutzt wird. Open WebUI auf
    # diesem Host embedded lokal mit all-MiniLM-L6-v2, nicht hier; Klaerung mit dem
    # Flows-Lastmanagement laeuft. Faellt sie negativ aus, kann der Dienst weg statt groesser.
    #
    # CPU/RAM-Caps: Platz fuer ollama (aktuell 2 Cores) + Rest-System.
    # Die 10G sind KEIN Puffer, sondern 0,05 GiB Luft — gemessen 24.09.2026, siehe oben.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 12G

  tei-rerank:
    logging: *logdefaults
    # CPU-only reranker (bge-reranker-v2-m3). Internal-only — the rerank-adapter service in front of this
    # exposes the GX-10-compatible /v1/rerank shape on host port 8082. TEI raw_scores per-request.
    # CPU-only Reranker — nur intern erreichbar; der rerank-adapter davor spricht das GX-10-Format.
    # fA-652 (Michael, 11.09.2026): festgenagelt auf den Stand, der HIER LAEUFT —
    # TEI 1.9.3, sha-f9a0643, gebaut 2026-06-22. Auf den DIGEST, nicht auf einen
    # Versions-Tag: am 11.09. gemessen trugen `cpu-latest` (e65aa131) UND
    # `cpu-1.9.3` (c26a2262) bereits andere Bits als das laufende Abbild. Ein
    # blosses Neuanlegen haette die Embedding-Engine also still ausgetauscht —
    # und Embeddings sind Ergebnis (Tabu ERGEBNIS): das scheitert nicht, es
    # liefert andere Zahlen. Ein Wechsel gehoert gemessen, nicht mitgenommen:
    # vorher/nachher `python3 tests/tei_acceptance.py` gegen GX-10.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:7f8cbd5fbf27d1ad82450b68ec37e542bbfb0d03e6dc79d6d00242022f2fc4c7
    container_name: tei-rerank
    restart: unless-stopped
    networks: [openllm-net]

    # No host port — reached via rerank-adapter over openllm-net.
    # Kein Host-Port — Zugriff nur ueber rerank-adapter im openllm-net.
    expose:
      - "80"

    volumes:
      - ${DATA_ROOT}/tei-rerank:/data

    environment:
      HUGGINGFACE_HUB_CACHE: "/data"
      HF_HOME: "/data"

    command:
      - --model-id=BAAI/bge-reranker-v2-m3
      - --max-batch-tokens=8192
      - --max-client-batch-size=32
      - --auto-truncate

    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 10G

  rerank-adapter:
    logging: *logdefaults
    # Thin Python-stdlib HTTP-Adapter: OpenAI /v1/rerank (documents/relevance_score) -> TEI /rerank
    # (texts/score, raw_scores:true). Makes TI-30 drop-in compatible with GX-10 for the Coordinator.
    # Duenner Adapter, damit Coordinator TI-30 wie GX-10 auf /v1/rerank ansprechen kann.
    image: python:3.12-slim
    container_name: rerank-adapter
    restart: unless-stopped
    networks: [openllm-net]
    depends_on:
      - tei-rerank

    ports:
      - "${BIND_IP}:8082:80"

    volumes:
      - ./rerank-adapter:/app:ro

    environment:
      TEI_URL: "http://tei-rerank/rerank"
      TEI_HEALTH: "http://tei-rerank/health"
      MODEL_NAME: "bge-reranker-v2-m3"
      PORT: "80"

    command: ["python3", "/app/adapter.py"]

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  ollama-logproxy:
    logging: *logdefaults
    # fA-338 ②: schreibt mit, WELCHER Agent wie viel Maschinenzeit kostet.
    # Ollama loggt keine Header — gemessen mit eigenem Header, User-Agent und dem
    # OpenAI-user-Feld gleichzeitig, null Treffer im gesamten Server-Log. Aus den
    # Server-Logs ist "welcher Agent kostet wie viel" deshalb nicht ableitbar.
    #
    # ADDITIV, und das ist der ganze Punkt: der klinische Pfad spricht weiter
    # direkt 11434 und merkt von diesem Container nichts. Nur wer zugeordnet
    # werden will, spricht 11435 und schickt X-Agent: agent:<agent_id>:<task>.
    # Faellt der Proxy aus, faellt nur die Buchhaltung aus, nicht die Inferenz.
    #
    # Gleiches Muster wie rerank-adapter: python:slim + stdlib, kein eigener Build.
    image: python:3.12-slim
    container_name: ollama-logproxy
    restart: unless-stopped
    networks: [openllm-net]
    depends_on:
      - ollama

    # fA-850: wie 11434, also am LAN. Das war am 13.09.2026 zwei Stunden lang
    # anders — der Port hing kurz nur am Tailnet — und Michael hat es am selben
    # Abend zurueckgenommen. Die Begruendung gehoert hierher, damit niemand die
    # Runde ein zweites Mal dreht:
    #
    # Der Proxy reicht nach 11434 durch, und 11434 steht im LAN offen und traegt
    # dort Last (ti-10, CT117). Wer im Praxisnetz Ollama benutzen will, nimmt
    # also ohnehin 11434. 11435 zu schliessen verhindert KEINE Faehigkeit; es
    # sieht nur nach Sicherheitsgewinn aus. Entweder gilt das LAN als
    # vertrauenswuerdig — dann darf auch dieser Port dort stehen —, oder es gilt
    # das nicht, dann ist 11434 der Vorgang und nicht dieser hier. Michaels
    # Entscheid: das LAN gilt als vertrauenswuerdig.
    #
    # Das Monitoring-Dashboard (3002) bleibt trotzdem drausssen, und das ist kein
    # Widerspruch: es gibt DATEN preis (Modellnamen, Client-Adressen, Zeitverlauf),
    # keine Faehigkeit. Die Trennlinie ist Mitlesen, nicht Zugriff.
    ports:
      - "${BIND_IP}:11435:80"

    volumes:
      - ./ollama-logproxy:/app:ro
      # Schreibend: der Proxy fuehrt eine EIGENE Tabelle (proxy_requests) in der
      # Monitoring-DB. Der bestehende Collector schreibt daneben unveraendert
      # weiter, ein Rueckbau ist ein DROP TABLE. DB und Sammler gehoeren root,
      # der Container laeuft als root — die WAL-Dateien bleiben damit lesbar
      # fuer beide Seiten.
      - ${DATA_ROOT}/monitoring:/monitoring

    environment:
      OLLAMA_URL: "http://ollama:11434"
      DB_PATH: "/monitoring/monitor.db"
      AGENT_HEADER: "X-Agent"
      PORT: "80"

    command: ["python3", "/app/proxy.py"]

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  openwebui:
    logging: *logdefaults
    # Pinned image version (not :latest) for controlled updates.
    # Image-Version gepinnt (nicht :latest), fuer kontrollierte Updates.
    image: ghcr.io/open-webui/open-webui:v0.6.43

    container_name: openwebui
    restart: unless-stopped
    networks: [openllm-net]
    depends_on:
      - ollama

    # External port from .env (default 3000).
    # Externer Port aus .env (Default 3000).
    ports:
      - "${BIND_IP}:${OPENWEBUI_PORT}:8080"

    # Persistence path is composable via DATA_ROOT in .env.
    # Persistenzpfad ueber DATA_ROOT in .env konfigurierbar.
    volumes:
      - ${DATA_ROOT}/openwebui:/app/backend/data

    environment:
      # WebUI talks to ollama internally over the docker network.
      # WebUI spricht intern den ollama-Service ueber Docker-Netz an.
      OLLAMA_BASE_URL: "http://ollama:11434"

networks:
  openllm-net:
    name: openllm-net
